name: Kaktus Data Scraper

on:
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

concurrency:
  group: kaktus-scraper
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalace knihoven
        run: pip install playwright requests

      - name: Instalace Playwright prohlížeče
        run: playwright install --with-deps chromium

      - name: Spuštění scraperu
        env:
          KAKTUS_USER: ${{ secrets.KAKTUS_USER }}
          KAKTUS_PASS: ${{ secrets.KAKTUS_PASS }}
          MACRODROID_WEBHOOK: ${{ secrets.MACRODROID_WEBHOOK }}
        run: python scraper.py

      - name: Uložení screenshotu při selhání
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error.png
          retention-days: 7

      - name: Auto Keepalive
        run: |
          if [ "$(date +%d)" = "01" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive commit pro reset 60denního limitu"
            git push || true
          fi
