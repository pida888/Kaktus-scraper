name: Kaktus Data Scraper

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalace knihoven
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Instalace Playwright prohlížečů
        run: playwright install chromium

      - name: Spuštění scraperu
        env:
          KAKTUS_USER: ${{ secrets.KAKTUS_USER }}
          KAKTUS_PASS: ${{ secrets.KAKTUS_PASS }}
          MACRODROID_WEBHOOK: ${{ secrets.MACRODROID_WEBHOOK }}
        run: python scraper.py

      - name: Udržení aktivity (Keepalive Workflow)
        uses: gautamkrishnar/keepalive-workflow@v2
