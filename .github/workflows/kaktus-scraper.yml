name: Kaktus Data Scraper

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalace knihoven
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Instalace Playwright prohlížečů
        run: playwright install chromium

      - name: Spuštění scraperu
        env:
          KAKTUS_USER: ${{ secrets.KAKTUS_USER }}
          KAKTUS_PASS: ${{ secrets.KAKTUS_PASS }}
          MACRODROID_WEBHOOK: ${{ secrets.MACRODROID_WEBHOOK }}
        run: python scraper.py

      # Udrží repozitář aktivní navždy bez cizích pluginů
      - name: Auto Keepalive (automatické probuzení)
        run: |
          # Běží pouze 1. den v měsíci, aby se repozitář zbytečně nespamoval
          if [ "$(date +%d)" = "01" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive commit pro udržení cronu"
            git push
          fi
